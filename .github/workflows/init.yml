name: init

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiplog-ingestion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup_shiplog
        with:
          install_dbmate: 'true'
          write_profile_config: 'true'
          shiplog_config_base64: ${{ vars.SHIPLOG_CONFIG_BASE64 }}
          wait_for_database: 'true'
          run_migrations: 'true'
          database_connection_string: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Initialize accounts and collect history
        run: bun run init
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GH_RO_CLASSIC_TOKEN: ${{ secrets.GH_RO_CLASSIC_TOKEN }}

      - uses: ./.github/actions/render_publish_readme
        with:
          database_connection_string: ${{ secrets.DATABASE_CONNECTION_STRING }}
          gh_rw_repo_token: ${{ secrets.GH_RW_REPO_TOKEN }}
