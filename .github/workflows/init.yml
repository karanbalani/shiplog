name: init

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write profile config
        run: |
          if [ -z "${SHIPLOG_CONFIG_BASE64:-}" ]; then
            echo "missing repository variable: SHIPLOG_CONFIG_BASE64" >&2
            exit 1
          fi
          printf '%s' "$SHIPLOG_CONFIG_BASE64" | base64 -d > profile_config.json
        env:
          SHIPLOG_CONFIG_BASE64: ${{ vars.SHIPLOG_CONFIG_BASE64 }}

      - name: Run migrations
        run: bun run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run initial backfill
        run: bun run init
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_API_TOKEN }}

      - name: Commit rendered README
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update rendered readme'
          file_pattern: README.md
