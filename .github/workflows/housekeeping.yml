name: housekeeping

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Number of days of error events to keep'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: shiplog-housekeeping-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prune-error-events:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v6

      - id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dbmate
        id: install_dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      - name: Install dependencies
        id: install_dependencies
        run: bun install --frozen-lockfile

      - name: Wait for database
        id: wait_database
        run: bun run db:wait
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Run migrations
        id: run_migrations
        run: bun run migrate
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Prune error events
        id: prune_errors
        run: bun run errors:prune
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          ERROR_EVENT_RETENTION_DAYS: ${{ github.event.inputs.retention_days || '30' }}

      - name: Write run summary
        id: write_summary
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if command -v bun >/dev/null 2>&1 && [ -f scripts/write_workflow_summary.ts ]; then
            bun scripts/write_workflow_summary.ts
          elif [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            failed_phase=bootstrap
            if [ "${SHIPLOG_CHECKOUT_OUTCOME:-}" != success ]; then
              failed_phase=checkout
            elif [ "${SHIPLOG_SETUP_BUN_OUTCOME:-}" != success ]; then
              failed_phase=setup_bun
            fi
            printf '## Shiplog · %s\n\n**Result:** ❌ Failed\n**Failed phase:** `%s`\n\nError code: [`SHIPLOG-UNKNOWN-001`](%s#shiplog-unknown-001)\n\n### How to fix\n\nReview the failed bootstrap step and job log, correct the setup problem, then rerun.\n' \
              "$SHIPLOG_WORKFLOW_NAME" "$failed_phase" "$SHIPLOG_ERROR_DOCS_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SHIPLOG_WORKFLOW_NAME: ${{ github.workflow }}
          SHIPLOG_JOB_NAME: ${{ github.job }}
          SHIPLOG_JOB_STATUS: ${{ job.status }}
          SHIPLOG_ERROR_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/ERRORS.md
          SHIPLOG_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SHIPLOG_SETUP_BUN_OUTCOME: ${{ steps.setup_bun.outcome }}
          SHIPLOG_STEPS_JSON: >-
            {"checkout":"${{ steps.checkout.outcome }}","setup_bun":"${{ steps.setup_bun.outcome }}","install_dbmate":"${{ steps.install_dbmate.outcome }}","install_dependencies":"${{ steps.install_dependencies.outcome }}","wait_database":"${{ steps.wait_database.outcome }}","run_migrations":"${{ steps.run_migrations.outcome }}","prune_errors":"${{ steps.prune_errors.outcome }}"}
