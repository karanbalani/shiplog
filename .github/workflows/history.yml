name: history

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'History mode: fast for authored commits, deep for co-authored/private contribution repair'
        required: false
        default: 'deep'
        type: choice
        options:
          - fast
          - deep
      max_minutes:
        description: 'Maximum run time before pausing between repositories'
        required: false
        default: '30'
        type: string
      repo_budget_minutes:
        description: 'Time budget reserved before starting another repository'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: shiplog-ingestion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write shiplog config
        run: |
          if [ -z "${SHIPLOG_CONFIG_BASE64:-}" ]; then
            echo "missing repository variable: SHIPLOG_CONFIG_BASE64" >&2
            exit 1
          fi
          printf '%s' "$SHIPLOG_CONFIG_BASE64" | base64 -d > shiplog.config.json
        env:
          SHIPLOG_CONFIG_BASE64: ${{ vars.SHIPLOG_CONFIG_BASE64 }}

      - name: Wait for database
        run: bun run db:wait
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Run migrations
        run: bun run migrate
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Initialize accounts
        run: bun run init
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GH_RO_CLASSIC_TOKEN: ${{ secrets.GH_RO_CLASSIC_TOKEN }}
          GH_RO_RESTRICTED_ORG_PAT_TOKEN: ${{ secrets.GH_RO_RESTRICTED_ORG_PAT_TOKEN }}

      - name: Improve historical activity
        run: bun run backfill
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GH_RO_CLASSIC_TOKEN: ${{ secrets.GH_RO_CLASSIC_TOKEN }}
          GH_RO_RESTRICTED_ORG_PAT_TOKEN: ${{ secrets.GH_RO_RESTRICTED_ORG_PAT_TOKEN }}
          BACKFILL_MODE: ${{ github.event.inputs.mode || 'deep' }}
          BACKFILL_MAX_MINUTES: ${{ github.event.inputs.max_minutes || '30' }}
          BACKFILL_REPO_BUDGET_MINUTES: ${{ github.event.inputs.repo_budget_minutes || '5' }}
