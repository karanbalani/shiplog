name: collect

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      collect_date:
        description: 'Optional YYYY-MM-DD date to collect exactly one day'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shiplog-ingestion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup_shiplog
        with:
          install_dbmate: 'true'
          write_profile_config: 'true'
          shiplog_config_base64: ${{ vars.SHIPLOG_CONFIG_BASE64 }}
          wait_for_database: 'true'
          run_migrations: 'true'
          database_connection_string: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Collect daily activity
        run: bun run collect
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GH_RO_CLASSIC_TOKEN: ${{ secrets.GH_RO_CLASSIC_TOKEN }}
          COLLECT_DATE: ${{ github.event.inputs.collect_date }}
