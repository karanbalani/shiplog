name: render

on:
  workflow_run:
    workflows:
      - collect
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup_shiplog
        with:
          write_profile_config: 'true'
          shiplog_config_base64: ${{ vars.SHIPLOG_CONFIG_BASE64 }}
          wait_for_database: 'true'
          database_connection_string: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - uses: ./.github/actions/render_publish_readme
        with:
          database_connection_string: ${{ secrets.DATABASE_CONNECTION_STRING }}
          gh_rw_repo_token: ${{ secrets.GH_RW_REPO_TOKEN }}
