name: integrity

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Integrity operation to run'
        required: false
        default: 'drift'
        type: choice
        options:
          - drift
          - repair
      drift_from:
        description: 'Optional YYYY-MM-DD range start for drift detection'
        required: false
        type: string
      drift_to:
        description: 'Optional YYYY-MM-DD range end for drift detection'
        required: false
        type: string
      drift_lookback_days:
        description: 'Optional recent-day window when no explicit range is provided'
        required: false
        type: string
      repair_chunk_days:
        description: 'Maximum days per queued maintenance repair task'
        required: false
        default: '7'
        type: string
      repair_date:
        description: 'Optional YYYY-MM-DD date to repair exactly one day'
        required: false
        type: string
      repair_from:
        description: 'Optional YYYY-MM-DD range start for repair'
        required: false
        type: string
      repair_to:
        description: 'Optional YYYY-MM-DD range end for repair'
        required: false
        type: string
      stale_lock_minutes:
        description: 'Optional minutes before a running maintenance task is considered stale'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: shiplog-ingestion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        uses: actions/checkout@v6

      - id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dbmate
        id: install_dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      - name: Install dependencies
        id: install_dependencies
        run: bun install --frozen-lockfile

      - name: Write shiplog config
        id: write_config
        run: |
          if [ -z "${SHIPLOG_CONFIG_BASE64:-}" ]; then
            echo "missing repository variable: SHIPLOG_CONFIG_BASE64" >&2
            exit 1
          fi
          printf '%s' "$SHIPLOG_CONFIG_BASE64" | base64 -d > shiplog.config.json
          bun -e "import { load } from './lib/config.ts'; load()"
        env:
          SHIPLOG_CONFIG_BASE64: ${{ vars.SHIPLOG_CONFIG_BASE64 }}

      - name: Export read token env
        id: export_read_tokens
        run: bun run tokens:export -- --scope read
        env:
          SHIPLOG_TOKEN_SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: Wait for database
        id: wait_database
        run: bun run db:wait
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Run migrations
        id: run_migrations
        run: bun run migrate
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Initialize accounts
        id: initialize_accounts
        run: bun run init
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Detect drift
        id: detect_drift
        if: github.event_name == 'schedule' || github.event.inputs.operation == 'drift'
        run: bun run drift
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          DRIFT_FROM: ${{ github.event.inputs.drift_from }}
          DRIFT_TO: ${{ github.event.inputs.drift_to }}
          DRIFT_LOOKBACK_DAYS: ${{ github.event.inputs.drift_lookback_days }}
          DRIFT_REPAIR_CHUNK_DAYS: ${{ github.event.inputs.repair_chunk_days || '7' }}

      - name: Repair selected range
        id: repair_range
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'repair'
        run: bun run repair
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          REPAIR_DATE: ${{ github.event.inputs.repair_date }}
          REPAIR_FROM: ${{ github.event.inputs.repair_from }}
          REPAIR_TO: ${{ github.event.inputs.repair_to }}

      - name: Run queued maintenance
        id: run_maintenance
        run: bun run maintenance
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          MAINTENANCE_STALE_LOCK_MINUTES: ${{ github.event.inputs.stale_lock_minutes }}

      - name: Write run summary
        id: write_summary
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if command -v bun >/dev/null 2>&1 && [ -f scripts/write_workflow_summary.ts ]; then
            bun scripts/write_workflow_summary.ts
          elif [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            failed_phase=bootstrap
            if [ "${SHIPLOG_CHECKOUT_OUTCOME:-}" != success ]; then
              failed_phase=checkout
            elif [ "${SHIPLOG_SETUP_BUN_OUTCOME:-}" != success ]; then
              failed_phase=setup_bun
            fi
            printf '## Shiplog · %s\n\n**Result:** ❌ Failed\n**Failed phase:** `%s`\n\nError code: [`SHIPLOG-UNKNOWN-001`](%s#shiplog-unknown-001)\n\n### How to fix\n\nReview the failed bootstrap step and job log, correct the setup problem, then rerun.\n' \
              "$SHIPLOG_WORKFLOW_NAME" "$failed_phase" "$SHIPLOG_ERROR_DOCS_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          SHIPLOG_WORKFLOW_NAME: ${{ github.workflow }}
          SHIPLOG_JOB_NAME: ${{ github.job }}
          SHIPLOG_JOB_STATUS: ${{ job.status }}
          SHIPLOG_ERROR_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/ERRORS.md
          SHIPLOG_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SHIPLOG_SETUP_BUN_OUTCOME: ${{ steps.setup_bun.outcome }}
          SHIPLOG_STEPS_JSON: >-
            {"checkout":"${{ steps.checkout.outcome }}","setup_bun":"${{ steps.setup_bun.outcome }}","install_dbmate":"${{ steps.install_dbmate.outcome }}","install_dependencies":"${{ steps.install_dependencies.outcome }}","write_config":"${{ steps.write_config.outcome }}","export_read_tokens":"${{ steps.export_read_tokens.outcome }}","wait_database":"${{ steps.wait_database.outcome }}","run_migrations":"${{ steps.run_migrations.outcome }}","initialize_accounts":"${{ steps.initialize_accounts.outcome }}","detect_drift":"${{ steps.detect_drift.outcome }}","repair_range":"${{ steps.repair_range.outcome }}","run_maintenance":"${{ steps.run_maintenance.outcome }}"}
