name: daily-publish

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shiplog-ingestion-${{ github.repository }}
  cancel-in-progress: false

jobs:
  daily-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write shiplog config
        run: |
          if [ -z "${SHIPLOG_CONFIG_BASE64:-}" ]; then
            echo "missing repository variable: SHIPLOG_CONFIG_BASE64" >&2
            exit 1
          fi
          printf '%s' "$SHIPLOG_CONFIG_BASE64" | base64 -d > shiplog.config.json
        env:
          SHIPLOG_CONFIG_BASE64: ${{ vars.SHIPLOG_CONFIG_BASE64 }}

      - name: Wait for database
        run: bun run db:wait
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Run migrations
        run: bun run migrate
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Initialize accounts
        run: bun run init
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GH_RO_CLASSIC_TOKEN: ${{ secrets.GH_RO_CLASSIC_TOKEN }}
          GH_RO_RESTRICTED_ORG_PAT_TOKEN: ${{ secrets.GH_RO_RESTRICTED_ORG_PAT_TOKEN }}

      - name: Collect current activity
        run: bun run collect
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GH_RO_CLASSIC_TOKEN: ${{ secrets.GH_RO_CLASSIC_TOKEN }}
          GH_RO_RESTRICTED_ORG_PAT_TOKEN: ${{ secrets.GH_RO_RESTRICTED_ORG_PAT_TOKEN }}

      - name: Run queued maintenance
        run: bun run maintenance
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}
          GH_RO_CLASSIC_TOKEN: ${{ secrets.GH_RO_CLASSIC_TOKEN }}
          GH_RO_RESTRICTED_ORG_PAT_TOKEN: ${{ secrets.GH_RO_RESTRICTED_ORG_PAT_TOKEN }}

      - name: Render README
        run: bun run render
        env:
          DATABASE_CONNECTION_STRING: ${{ secrets.DATABASE_CONNECTION_STRING }}

      - name: Print rendered README
        run: |
          echo "::group::rendered.md"
          cat rendered.md
          echo "::endgroup::"

      - name: Publish rendered README
        run: bun run publish
        env:
          GH_RW_REPO_TOKEN: ${{ secrets.GH_RW_REPO_TOKEN }}
